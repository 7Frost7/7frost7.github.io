<script>document.write("\u003c\u0021\u0044\u004f\u0043\u0054\u0059\u0050\u0045\u0020\u0068\u0074\u006d\u006c\u003e\u000a\u003c\u0068\u0074\u006d\u006c\u003e\u000a\u003c\u0068\u0065\u0061\u0064\u003e\u000a\u0020\u0020\u003c\u006d\u0065\u0074\u0061\u0020\u0063\u0068\u0061\u0072\u0073\u0065\u0074\u003d\u0022\u0055\u0054\u0046\u002d\u0038\u0022\u003e\u000a\u0020\u0020\u003c\u006d\u0065\u0074\u0061\u0020\u006e\u0061\u006d\u0065\u003d\u0022\u0076\u0069\u0065\u0077\u0070\u006f\u0072\u0074\u0022\u0020\u0063\u006f\u006e\u0074\u0065\u006e\u0074\u003d\u0022\u0077\u0069\u0064\u0074\u0068\u003d\u0064\u0065\u0076\u0069\u0063\u0065\u002d\u0077\u0069\u0064\u0074\u0068\u002c\u0020\u0069\u006e\u0069\u0074\u0069\u0061\u006c\u002d\u0073\u0063\u0061\u006c\u0065\u003d\u0031\u002e\u0030\u0022\u003e\u000a\u0020\u0020\u003c\u0074\u0069\u0074\u006c\u0065\u003e\u0049\u0042\u0057\u0020\u0053\u004d\u0050\u003c\u002f\u0074\u0069\u0074\u006c\u0065\u003e\u000a\u000a\u0020\u0020\u003c\u0073\u0074\u0079\u006c\u0065\u003e\u000a\u0020\u0020\u0020\u0020\u0040\u0066\u006f\u006e\u0074\u002d\u0066\u0061\u0063\u0065\u0020\u007b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0066\u006f\u006e\u0074\u002d\u0066\u0061\u006d\u0069\u006c\u0079\u003a\u0020\u006d\u0069\u006e\u0065\u0063\u0072\u0061\u0066\u0074\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0073\u0072\u0063\u003a\u0020\u0075\u0072\u006c\u0028\u0022\u004d\u0069\u006e\u0065\u0063\u0072\u0061\u0066\u0074\u002e\u0074\u0074\u0066\u0022\u0029\u0020\u0066\u006f\u0072\u006d\u0061\u0074\u0028\u0022\u0074\u0072\u0075\u0065\u0074\u0079\u0070\u0065\u0022\u0029\u003b\u000a\u0020\u0020\u0020\u0020\u007d\u000a\u000a\u0020\u0020\u0020\u0020\u0068\u0074\u006d\u006c\u002c\u0020\u0062\u006f\u0064\u0079\u0020\u007b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u006d\u0061\u0072\u0067\u0069\u006e\u003a\u0020\u0030\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0077\u0069\u0064\u0074\u0068\u003a\u0020\u0031\u0030\u0030\u0025\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0068\u0065\u0069\u0067\u0068\u0074\u003a\u0020\u0031\u0030\u0030\u0025\u003b\u000a\u0020\u0020\u0020\u0020\u007d\u000a\u000a\u0020\u0020\u0020\u0020\u0062\u006f\u0064\u0079\u0020\u007b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u006f\u0076\u0065\u0072\u0066\u006c\u006f\u0077\u003a\u0020\u0068\u0069\u0064\u0064\u0065\u006e\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0062\u0061\u0063\u006b\u0067\u0072\u006f\u0075\u006e\u0064\u003a\u0020\u0075\u0072\u006c\u0028\u0022\u0068\u0074\u0074\u0070\u0073\u003a\u002f\u002f\u0072\u0061\u0077\u002e\u0067\u0069\u0074\u0068\u0075\u0062\u0075\u0073\u0065\u0072\u0063\u006f\u006e\u0074\u0065\u006e\u0074\u002e\u0063\u006f\u006d\u002f\u0064\u0072\u0061\u0067\u006f\u006e\u0037\u0033\u0031\u0030\u0031\u0032\u002f\u0045\u0061\u0067\u006c\u0065\u0072\u0063\u0072\u0061\u0066\u0074\u002d\u0031\u002e\u0031\u0032\u002d\u0053\u0065\u0072\u0076\u0065\u0072\u002d\u0048\u006f\u0073\u0074\u0069\u006e\u0067\u002f\u0072\u0065\u0066\u0073\u002f\u0068\u0065\u0061\u0064\u0073\u002f\u0046\u0061\u006c\u0069\u0078\u006e\u006f\u0064\u0065\u0073\u002d\u004f\u004e\u004c\u0059\u002d\u0056\u0031\u002d\u0028\u0045\u0061\u0067\u006c\u0065\u0072\u0058\u0053\u0065\u0072\u0076\u0065\u0072\u0029\u002f\u0077\u0065\u0062\u002f\u0064\u0069\u0072\u0074\u002e\u006a\u0070\u0067\u0022\u0029\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0062\u0061\u0063\u006b\u0067\u0072\u006f\u0075\u006e\u0064\u002d\u0073\u0069\u007a\u0065\u003a\u0020\u0063\u006f\u0076\u0065\u0072\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0062\u0061\u0063\u006b\u0067\u0072\u006f\u0075\u006e\u0064\u002d\u0070\u006f\u0073\u0069\u0074\u0069\u006f\u006e\u003a\u0020\u0063\u0065\u006e\u0074\u0065\u0072\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0062\u0061\u0063\u006b\u0067\u0072\u006f\u0075\u006e\u0064\u002d\u0072\u0065\u0070\u0065\u0061\u0074\u003a\u0020\u006e\u006f\u002d\u0072\u0065\u0070\u0065\u0061\u0074\u003b\u000a\u0020\u0020\u0020\u0020\u0020\u0020\u0064\u0069\u0073\u0070\u006c\u0061\u00
